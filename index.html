<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marty's Space</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0c0a14;
      --bg2:      #131022;
      --bg3:      #1c1730;
      --card:     #16112a;
      --card-hov: #1e1838;
      --border:   rgba(168,85,247,0.22);
      --border-hov: rgba(168,85,247,0.55);
      --accent:   #a855f7;
      --accent2:  #7c3aed;
      --text:     #e2d9f3;
      --text-dim: #8b7aa8;
      --radius:   12px;
      --radius-sm: 6px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      overflow: hidden;
      padding: 72px 24px 56px;
      text-align: center;
      background: linear-gradient(160deg, #1a0a2e 0%, #0c0a14 60%);
      border-bottom: 1px solid var(--border);
    }

    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(168,85,247,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .site-title {
      font-size: clamp(2rem, 6vw, 3.6rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #d8b4fe 0%, #a855f7 50%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
    }

    .site-subtitle {
      margin-top: 12px;
      font-size: 1rem;
      color: var(--text-dim);
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      position: relative;
    }

    .header-links {
      margin-top: 22px;
      display: flex;
      justify-content: center;
      gap: 12px;
      position: relative;
    }

    .header-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      color: var(--text-dim);
      border: 1px solid var(--border);
      background: rgba(168,85,247,0.06);
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .header-link:hover {
      color: var(--accent);
      border-color: var(--border-hov);
      background: rgba(168,85,247,0.12);
    }

    /* ── MAIN ── */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 52px 20px 80px;
    }

    /* ── CATEGORY SECTION ── */
    .category {
      margin-bottom: 52px;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .category-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .category-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .category-count {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* ── CARD GRID ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .card:hover {
      border-color: var(--border-hov);
      background: var(--card-hov);
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .card-icon {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: rgba(168,85,247,0.12);
      border: 1px solid rgba(168,85,247,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .card-title-wrap { flex: 1; min-width: 0; }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
      flex: 1;
    }

    /* ── BADGES ── */
    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 99px;
      letter-spacing: 0.03em;
    }

    .badge-category {
      background: rgba(168,85,247,0.14);
      color: #c084fc;
      border: 1px solid rgba(168,85,247,0.3);
    }

    .badge-active {
      background: rgba(34,197,94,0.12);
      color: #4ade80;
      border: 1px solid rgba(34,197,94,0.3);
    }
    .badge-wip {
      background: rgba(245,158,11,0.12);
      color: #fbbf24;
      border: 1px solid rgba(245,158,11,0.3);
    }
    .badge-completed {
      background: rgba(59,130,246,0.12);
      color: #60a5fa;
      border: 1px solid rgba(59,130,246,0.3);
    }
    .badge-paused {
      background: rgba(107,114,128,0.14);
      color: #9ca3af;
      border: 1px solid rgba(107,114,128,0.3);
    }
    .badge-abandoned {
      background: rgba(185,28,28,0.1);
      color: #f87171;
      border: 1px solid rgba(248,113,113,0.25);
    }
    .badge-seasonal {
      background: rgba(20,184,166,0.1);
      color: #2dd4bf;
      border: 1px solid rgba(45,212,191,0.3);
    }

    .badge-date {
      background: rgba(255,255,255,0.05);
      color: var(--text-dim);
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* ── OPEN BUTTON ── */
    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 2px;
    }

    .btn-open {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      background: rgba(168,85,247,0.14);
      color: #c084fc;
      border: 1px solid rgba(168,85,247,0.3);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .card:hover .btn-open,
    .btn-open:hover {
      background: rgba(168,85,247,0.28);
      border-color: rgba(168,85,247,0.6);
      color: #e9d5ff;
    }

    .btn-open svg { width: 13px; height: 13px; flex-shrink: 0; }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      header { padding: 52px 16px 40px; }
      main { padding: 36px 14px 60px; }
      .card { padding: 18px; }
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1 class="site-title">Marty's Space</h1>
  <p class="site-subtitle">A collection of games, tools, and trackers built for fun.</p>
  <div class="header-links">
    <a class="header-link" href="https://github.com/Martys-Space" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
        <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.744 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
      </svg>
      GitHub
    </a>
  </div>
</header>

<main id="main"></main>

<footer>
  Built by <a href="https://github.com/Martys-Space" target="_blank" rel="noopener">Marty</a> &mdash; hosted on GitHub Pages
</footer>

<script>
  // ── PROJECT DATA ──────────────────────────────────────────────────────────
  // status: 'active' | 'wip' | 'completed' | 'paused'
  const PROJECTS = [
    {
      category: "Games",
      items: [
        {
          icon: "⛏️",
          title: "Idle Worker",
          subtitle: "Browser idle/incremental game",
          desc: "Manage a team of workers assigned to skilling jobs (woodcutting, fishing, mining, cooking…) or combat. Level up workers and global skills, craft gear to boost performance, and progress through equipment tiers from bronze to godtier.",
          status: "active",
          statusLabel: "Active",
          updated: "2026-03-18",
          href: "/idleworker/",
        },
        {
          icon: "🏋️",
          title: "Training Game",
          subtitle: "Daily real-world activity game",
          desc: "Build activity plans for real-life workouts, mark them done to earn XP and gold, then invest in businesses for passive income. Designed so real-world effort is always the most rewarding path.",
          status: "paused",
          statusLabel: "On Hold",
          updated: null,
          href: "/training-game/",
        },
      ],
    },
    {
      category: "Game Trackers",
      items: [
        {
          icon: "🗡️",
          title: "SAO Re: Hollow Fragment Tracker",
          subtitle: "Sword Art Online Re: Hollow Fragment",
          desc: "A completion tracker for SAO Re: Hollow Fragment. Track hollow missions, floor bosses, character affection, implementations, and all 54 Steam achievements.",
          status: "completed",
          statusLabel: "Completed",
          updated: "2026-03-18",
          href: "/sword-art-online-re-hollow-fragment/docs/",
        },
        {
          icon: "💀",
          title: "OSRS Boss Tracker",
          subtitle: "Old School RuneScape",
          desc: "Set kill count goals for any OSRS boss and track your progress over time. Features a custom XP progression system with title unlocks from Level 1–999, goal history, and WiseOldMan API integration.",
          status: "completed",
          statusLabel: "Completed",
          updated: null,
          href: "/osrsbosstracker/",
        },
        {
          icon: "🏆",
          title: "OSRS Leagues VI",
          subtitle: "Old School RuneScape — Seasonal (Apr–Jun 2026)",
          desc: "A tracker and helper built for OSRS Leagues 6. Covers league-specific tasks, point tracking, and planning tools for the duration of the season. Temporary project — active while the league runs.",
          status: "seasonal",
          statusLabel: "Seasonal",
          updated: null,
          href: "/osrs-leagues-vi/",
        },
      ],
    },
    {
      category: "Tools",
      items: [
        {
          icon: "⚙️",
          title: "HySkills Builder",
          subtitle: "Hytale mod tool",
          desc: "A skill builder for the HySkills mod for Hytale. Lets users create and configure custom skills for the mod. Development ended when the mod's developer stopped working on the project.",
          status: "abandoned",
          statusLabel: "Abandoned",
          updated: null,
          href: "/hytale/hyskills/",
        },
      ],
    },
  ];
  // ─────────────────────────────────────────────────────────────────────────

  const STATUS_CLASS = {
    active:    'badge-active',
    wip:       'badge-wip',
    completed: 'badge-completed',
    paused:    'badge-paused',
    abandoned: 'badge-abandoned',
    seasonal:  'badge-seasonal',
  };

  const STATUS_DOT = {
    active:    '●',
    wip:       '◑',
    completed: '✔',
    paused:    '○',
    abandoned: '✕',
    seasonal:  '◈',
  };

  function formatDate(iso) {
    if (!iso) return null;
    const [y, m, d] = iso.split('-');
    return new Date(+y, +m - 1, +d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function renderCard(p) {
    const statusClass = STATUS_CLASS[p.status] || 'badge-paused';
    const dot = STATUS_DOT[p.status] || '○';
    const dateStr = formatDate(p.updated);

    return `
      <a class="card" href="${p.href}">
        <div class="card-top">
          <div class="card-icon">${p.icon}</div>
          <div class="card-title-wrap">
            <div class="card-title">${p.title}</div>
            ${p.subtitle ? `<div class="card-subtitle">${p.subtitle}</div>` : ''}
          </div>
        </div>
        <p class="card-desc">${p.desc}</p>
        <div class="card-badges">
          <span class="badge ${statusClass}">${dot} ${p.statusLabel}</span>
          ${dateStr ? `<span class="badge badge-date">Updated ${dateStr}</span>` : ''}
        </div>
        <div class="card-footer">
          <span class="btn-open">
            Open
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </span>
        </div>
      </a>`;
  }

  function renderAll() {
    const main = document.getElementById('main');
    main.innerHTML = PROJECTS.map(cat => `
      <section class="category">
        <div class="category-header">
          <span class="category-title">${cat.category}</span>
          <span class="category-line"></span>
          <span class="category-count">${cat.items.length} project${cat.items.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="card-grid">
          ${cat.items.map(renderCard).join('')}
        </div>
      </section>
    `).join('');
  }

  renderAll();
</script>

</body>
</html>
